<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>編集デスク｜管制塔</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#F4F2EA; --card:#FCFBF6; --ink:#212B41; --inkSoft:#63604F;
    --rule:#DFD9C9; --red:#BE402C; --good:#4C6B55;
    --fukugyo:#C0623B; --intj:#1F2A44; --intp:#2E7D6B;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
    padding:0 18px 120px;line-height:1.6}
  .wrap{max-width:680px;margin:0 auto}
  header{padding:26px 0 6px}
  .logo{display:flex;align-items:flex-end;gap:10px}
  h1{font-family:var(--mincho);font-size:28px;letter-spacing:.04em;margin:0;line-height:1}
  .sub{color:var(--inkSoft);font-size:13px;margin:8px 0 0}
  details{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin:12px 0}
  summary{cursor:pointer;font-size:14px}
  label{display:block;font-size:12px;color:var(--inkSoft);margin:10px 0 3px}
  input[type=text],input[type=password],input[type=date],input[type=number],select{
    width:100%;border:1px solid var(--rule);border-radius:9px;padding:9px 11px;font-size:14px;
    background:#fff;color:var(--ink);font-family:var(--gothic)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  button{font-family:var(--gothic);cursor:pointer;border:none;border-radius:10px}
  .btn{background:var(--ink);color:var(--paper);padding:9px 16px;font-size:14px}
  .btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink)}
  .btn.small{padding:6px 12px;font-size:13px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:var(--paper);z-index:5}
  .tab{flex:0 0 auto;padding:8px 13px;font-size:13px;border:1px solid var(--rule);background:transparent;color:var(--inkSoft);border-radius:999px}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .subtabs{display:flex;gap:6px;margin:4px 0 12px}
  .msg{font-size:13px;margin:6px 0 10px;min-height:18px}
  .msg.err{color:var(--red)} .msg.good{color:var(--good)} .msg.info{color:var(--inkSoft)}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:14px}
  .card.on{border-color:var(--good)}
  .card.done{opacity:.6}
  .accbar{border-left:5px solid var(--c,#888);padding-left:10px}
  .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .slot{font-family:var(--mincho);font-size:18px}
  .type{font-size:12px;color:var(--inkSoft)}
  .badge{font-size:11px;border:1px solid var(--rule);border-radius:999px;padding:2px 8px;color:var(--inkSoft)}
  .badge.good{border-color:var(--good);color:var(--good)} .badge.red{border-color:var(--red);color:var(--red)}
  .right{margin-left:auto}
  textarea{width:100%;border:1px solid var(--rule);border-radius:11px;padding:12px;
    font-size:15px;line-height:1.85;font-family:var(--gothic);color:var(--ink);background:#fff;resize:vertical}
  .foot{display:flex;align-items:center;gap:12px;margin-top:8px}
  .count{font-size:12px;color:var(--inkSoft)}
  .score{margin-left:auto;font-size:12px}
  .marks{margin-top:10px;font-size:13px}
  .mark{display:flex;gap:8px;margin-bottom:5px;align-items:baseline}
  .mw{color:var(--red);text-decoration:underline wavy;text-underline-offset:3px}
  .mwhy{color:var(--inkSoft);font-size:12px}
  .ok{color:var(--good)}
  .toggle{padding:8px 14px;font-size:14px;border:1px solid var(--rule);background:transparent;color:var(--inkSoft)}
  .toggle.on{background:var(--good);color:var(--paper);border-color:var(--good)}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
    border-top:1px solid var(--rule);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .savebar .btn{flex:1;max-width:420px;padding:13px}
  .hidden{display:none!important}
  .hint{font-size:12px;color:var(--inkSoft);margin-top:8px;line-height:1.7}
  .sum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
  .sum b{font-size:18px;font-family:var(--mincho)}
  .article{background:#fff;border:1px solid var(--rule);border-radius:11px;padding:16px;line-height:1.95;font-size:15px}
  .article h2{font-size:18px;margin:22px 0 8px} .article h3{font-size:16px;margin:18px 0 6px}
  .article p{margin:0 0 14px}
  .paywall{border:none;border-top:2px dashed var(--red);margin:22px 0;position:relative}
  .paywall::after{content:"ここから有料";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    background:#fff;color:var(--red);font-size:12px;padding:0 8px}
  .ntitle{font-family:var(--mincho);font-size:20px;margin:0 0 10px}
  .chartbox{position:relative;height:240px}
  .top{font-size:13px;border-bottom:1px solid var(--rule);padding:8px 0}
  .top:last-child{border-bottom:none}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .tag{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
  .tag.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  h2.sec{font-family:var(--mincho);font-size:17px;margin:4px 0 10px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <h1>管制塔</h1>
      <svg width="34" height="20" viewBox="0 0 34 20" fill="none" style="margin-bottom:3px">
        <path d="M2 15 C 9 4, 15 4, 20 11 S 30 15, 32 5" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="sub">3アカの自動投稿を見張って、必要なら止める。</p>
  </header>

  <details id="cfg">
    <summary>設定（初回だけ）</summary>
    <label>GitHubユーザー名（owner）</label>
    <input type="text" id="owner" autocapitalize="off" autocorrect="off" spellcheck="false"/>
    <label>リポジトリ名（repo）</label>
    <input type="text" id="repo" autocapitalize="off" autocorrect="off" spellcheck="false"/>
    <label>ブランチ</label>
    <input type="text" id="branch" autocapitalize="off" autocorrect="off" spellcheck="false"/>
    <label>アクセストークン（Fine-grained PAT・Contents読み書き）</label>
    <input type="password" id="token" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"/>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="saveCfg">保存</button>
      <button class="btn ghost" id="clearTok">トークンを消す</button>
    </div>
    <p class="hint">トークンはこの端末のブラウザ内だけに保存され、GitHub以外には送りません。URLには入れないでください。</p>
  </details>

  <div class="tabs" id="tabs"></div>
  <div class="row" style="margin-bottom:6px">
    <input type="date" id="date" style="max-width:180px"/>
    <button class="btn ghost" id="reload">読み込む</button>
  </div>
  <p class="msg info" id="msg"></p>
  <div id="view"></div>
</div>

<div class="savebar hidden" id="savebar">
  <button class="btn" id="save">GitHubに保存</button>
</div>

<script>
/* ===== アカウント定義（accounts.py と合わせる） ===== */
const ACC={
  fukugyo:{handle:"salesman_firsttime",q:"queue",d:"drafts",n:"notes/fukugyo",color:"var(--fukugyo)",
    types:{shoutai:"困りごと",shoumou:"実況",naoshi:"小技",jitsuen:"やってよかった",cta:"本音"}},
  intj:{handle:"intj_labo",q:"queue/intj",d:"drafts/intj",n:"notes/intj",color:"var(--intj)",
    types:{aruaru:"観察",gokai:"場面",shikou:"深掘り",ningen:"扱い方",dantei:"本音"}},
  intp:{handle:"intp_labo",q:"queue/intp",d:"drafts/intp",n:"notes/intp",color:"var(--intp)",
    types:{aruaru:"観察",toi:"場面",datsusen:"深掘り",gokai:"扱い方",hitorigoto:"本音"}},
};
Object.values(ACC).forEach(a=>a.types.announce="note告知");
const CHART_COLOR={fukugyo:"#C0623B",intj:"#1F2A44",intp:"#2E7D6B"};

/* ===== 朱入れ（従来と同じ） ===== */
const NG=[["いかがでした","問いかけの締めは避ける。言い切る"],["いかがでしょう","問いかけの締めは避ける。言い切る"],
["と言えるでしょう","言い切る（〜だ）"],["と言えます","言い切る（〜だ）"],["重要です","なぜ重要かを場面で示す"],
["大切です","具体で示す"],["様々な","固有名詞・数字・一場面に"],["さまざまな","固有名詞・数字・一場面に"],
["多くの","数字か具体の対象に"],["いろいろな","具体に落とす"],["非常に","程度語を消して具体に"],
["とても","程度語を消して具体に"],["かなり","程度語を消して具体に"],["しっかり","何をどうするか具体に"],
["きちんと","何をどうするか具体に"],["ぜひ","消す"],["まとめると","要約の合図はいらない"],
["ではないでしょうか","言い切るか、問いを一つに"],["と思います","言い切れる所は言い切る"],
["大切なのは","具体で示す"],["わけじゃない。ただ","型っぽい言い回し。別の言い方に"],["わけではない。ただ","型っぽい言い回し。別の言い方に"],
["それだけで","型っぽい言い回し。別の言い方に"],["少し楽になる","型っぽい締め。具体に"],["てもいい。","読み手への指示形。自分の語りに"],
["なくていい。","読み手への指示形。自分の語りに"],["すべき","読み手への指示形。自分の語りに"],["【実数】","数字が埋まっていない"]];
const HYPE=[["必ず","誇大"],["確実に","誇大"],["最短で","誇大"],["最短","誇大"],["誰でも","誇大"],["稼げる","誇大"]];
const HW=new Set(HYPE.map(h=>h[0]));
function analyze(t){t=t||"";
  const chars=t.replace(/\s/g,"").length;
  const lines=t.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const groups=t.split(/\n\s*\n/).map(g=>g.trim()).filter(Boolean).length;
  const flags=[]; NG.concat(HYPE).forEach(([w,why])=>{if(t.includes(w))flags.push({w,why,hype:HW.has(w)});});
  const pe=/(です|ます|ました|でした|ません|でしょう)。?$/;
  const allPolite=lines.length>=3&&lines.every(l=>pe.test(l));
  let s=100-flags.length*12; if(chars>250)s-=15; if(groups>5)s-=10; if(allPolite)s-=12;
  return{chars,groups,flags,allPolite,score:Math.max(0,Math.min(100,s))};
}

/* ===== GitHub ===== */
const LS="henshu.gh.";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 全角スペースや日本語など、ヘッダーに使えない文字は取り除く */
const clean=v=>(v||"").replace(/[^\x21-\x7E]/g,"");
function cfg(){return{owner:clean($("owner").value),repo:clean($("repo").value),
  branch:clean($("branch").value)||"main",token:clean($("token").value)};}
function loadCfg(){["owner","repo","branch","token"].forEach(k=>{const v=localStorage.getItem(LS+k);if(v)$(k).value=v;});
  if(!$("branch").value)$("branch").value="henshu-routine";}
function saveCfgLS(){["owner","repo","branch","token"].forEach(k=>{$(k).value=clean($(k).value);localStorage.setItem(LS+k,$(k).value);});}
function b64enc(str){const b=new TextEncoder().encode(str);let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s);}
function b64dec(b){const bin=atob((b||"").replace(/\n/g,""));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));}
function todayJST(){return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"});}
function addDays(d,n){const t=new Date(d+"T00:00:00+09:00");t.setDate(t.getDate()+n);return t.toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"});}
function api(path,opt){const c=cfg();return fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+path,
  Object.assign({headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}},opt||{}));}
/* ファイル取得: {status, sha, text} */
async function getFile(path){
  const r=await api("/contents/"+path+"?ref="+encodeURIComponent(cfg().branch)+"&t="+Date.now());
  if(r.status===401||r.status===403) throw new Error("トークンが無効か権限不足です（Contents読み書き・対象リポを確認）");
  if(!r.ok) return {status:r.status};
  const j=await r.json();
  return {status:200,sha:j.sha,text:b64dec(j.content)};
}
async function getBlobURL(path){
  const c=cfg();
  const r=await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+path+"?ref="+encodeURIComponent(c.branch),
    {headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github.raw","X-GitHub-Api-Version":"2022-11-28"}});
  if(!r.ok) return null;
  return URL.createObjectURL(await r.blob());
}
async function putFile(path,text,sha,message){
  const body={message,content:b64enc(text),branch:cfg().branch};
  if(sha) body.sha=sha;
  const r=await api("/contents/"+path,{method:"PUT",body:JSON.stringify(body)});
  if(r.status===409||r.status===422) return {conflict:true};
  if(!r.ok) throw new Error("保存失敗（"+r.status+"）");
  return {sha:(await r.json()).content.sha};
}
function setMsg(t,cls){const m=$("msg");m.textContent=t||"";m.className="msg "+(cls||"info");}

/* ===== 状態とURL ===== */
const params=new URLSearchParams(location.search);
const state={tab:"all",sub:"posts",date:todayJST(),queues:{},chart:[]};
if(params.get("date")) state.date=params.get("date");
if(params.get("acc")&&ACC[params.get("acc")]) state.tab=params.get("acc");
if(params.get("type")==="note") state.sub="note";
if(params.get("view")==="stats") state.tab="stats";

function drawTabs(){
  const tabs=[["all","全体"],...Object.keys(ACC).map(k=>[k,ACC[k].handle]),["stats","数字"]];
  $("tabs").innerHTML=tabs.map(([k,l])=>'<button class="tab'+(state.tab===k?" on":"")+'" data-tab="'+k+'">'+esc(l)+'</button>').join("");
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;
  state.tab=b.dataset.tab; if(state.tab!=="all"&&state.tab!=="stats"&&!ACC[state.tab])return; route();});

async function route(){
  drawTabs();
  state.chart.forEach(c=>c.destroy()); state.chart=[];
  $("savebar").classList.add("hidden");
  const c=cfg();
  if(!c.owner||!c.repo||!c.token){setMsg("設定を入れてください（owner / repo / ブランチ / トークン）","err");$("cfg").open=true;$("view").innerHTML="";return;}
  setMsg("読み込み中…","info");
  try{
    if(state.tab==="all") await viewAll();
    else if(state.tab==="stats") await viewStats();
    else if(state.sub==="note") await viewNote(state.tab);
    else await viewPosts(state.tab);
  }catch(e){setMsg(e.message,"err");}
}

/* ===== キュー ===== */
async function loadQueue(acc){
  const path=ACC[acc].q+"/"+state.date+".json";
  const f=await getFile(path);
  if(f.status!==200){state.queues[acc]=null;return null;}
  state.queues[acc]={path,sha:f.sha,data:JSON.parse(f.text)};
  return state.queues[acc];
}
function statusOf(it){
  if(it.posted) return ["投稿済み","good"];
  if(it.skipped) return ["スキップ",""];
  if(!it.approved) return ["止めている","red"];
  return ["自動投稿待ち",""];
}

/* ===== 全体 ===== */
async function viewAll(){
  const keys=Object.keys(ACC);
  const qs=await Promise.all(keys.map(loadQueue));
  let html="";
  keys.forEach((k,i)=>{
    const a=ACC[k], q=qs[i];
    html+='<div class="card accbar" style="--c:'+a.color+'"><div class="meta"><span class="slot">'+esc(a.handle)+'</span>'
      +'<button class="btn ghost small right" data-go="'+k+'">開く</button></div>';
    if(!q){html+='<div class="type">'+state.date+' の下書きはまだありません</div></div>';return;}
    const it=q.data.items||[];
    const ok=it.filter(x=>x.approved).length, done=it.filter(x=>x.posted).length, sk=it.filter(x=>x.skipped).length;
    const next=it.find(x=>x.approved&&!x.posted&&!x.skipped);
    html+='<div class="sum"><span>合格 <b>'+ok+'</b>/'+it.length+'</span><span>投稿済み <b>'+done+'</b></span><span>スキップ <b>'+sk+'</b></span></div>'
      +'<div class="type" style="margin-top:6px">'+(next?("次の投稿："+esc(next.slot)+"　"+esc(a.types[next.type]||next.type)):"今日の予定はすべて終わり")+'</div></div>';
  });
  $("view").innerHTML=html; setMsg("");
}
$("view").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;state.tab=b.dataset.go;state.sub="posts";route();});

/* ===== 投稿 ===== */
function subTabs(acc){
  return '<div class="subtabs"><button class="tab'+(state.sub==="posts"?" on":"")+'" data-sub="posts">Threads</button>'
    +'<button class="tab'+(state.sub==="note"?" on":"")+'" data-sub="note">note</button></div>';
}
$("view").addEventListener("click",e=>{const b=e.target.closest("[data-sub]");if(!b)return;state.sub=b.dataset.sub;route();});

async function viewPosts(acc){
  const q=await loadQueue(acc);
  if(!q){$("view").innerHTML=subTabs(acc)+'<p class="type">'+state.date+' の下書きはまだありません（朝の生成待ち）</p>';setMsg("");return;}
  const items=q.data.items||[], a=ACC[acc];
  let html=subTabs(acc);
  items.forEach((it,i)=>{
    const fixed=it.posted||it.skipped;
    const [st,cls]=statusOf(it);
    html+='<div class="card'+(it.approved&&!fixed?" on":"")+(fixed?" done":"")+'">'
      +'<div class="meta"><span class="slot">'+esc(it.slot)+'</span><span class="type">'+esc(a.types[it.type]||it.type)+'</span>'
      +(it.ai_score!=null?'<span class="badge">AI '+it.ai_score+'</span>':'')
      +'<span class="badge '+cls+' right">'+st+'</span></div>'
      +'<textarea data-idx="'+i+'" rows="6" '+(fixed?"disabled":"")+'>'+esc(it.text)+'</textarea>'
      +'<div class="foot"><span class="count" id="cnt-'+i+'"></span><span class="score" id="scr-'+i+'"></span></div>'
      +'<div class="marks" id="chk-'+i+'"></div>'
      +(it.m24?'<div class="type" style="margin-top:6px">24h：閲覧'+(it.m24.views??"-")+' / いいね'+(it.m24.likes??"-")+' / 返信'+(it.m24.replies??"-")+'</div>':'')
      +(fixed?'':'<div style="margin-top:10px"><button class="toggle'+(it.approved?" on":"")+'" data-tg="'+i+'">'+(it.approved?"自動投稿ON（押すと止める）":"止めている（押すと戻す）")+'</button></div>')
      +'</div>';
  });
  $("view").innerHTML=html;
  items.forEach((_,i)=>refreshCheck(acc,i));
  $("savebar").classList.remove("hidden");
  $("save").textContent=a.handle+" の変更をGitHubに保存";
  setMsg("");
}
function refreshCheck(acc,i){
  const it=state.queues[acc].data.items[i]; const a=analyze(it.text||"");
  if(!$("cnt-"+i))return;
  $("cnt-"+i).textContent=a.chars+"字 · "+a.groups+"かたまり";
  const sc=$("scr-"+i); sc.textContent="人間味 "+a.score; sc.style.color=a.score>=80?"var(--good)":"var(--red)";
  const box=$("chk-"+i); box.innerHTML="";
  if(a.flags.length===0&&!a.allPolite){box.innerHTML='<span class="ok">直す場所は見つからない。</span>';return;}
  if(a.allPolite)box.insertAdjacentHTML("beforeend",'<div class="mark"><span class="mw">敬体</span><span class="mwhy">全文が敬体。一行だけ体言止めや独り言に崩す</span></div>');
  a.flags.forEach(f=>box.insertAdjacentHTML("beforeend",'<div class="mark"><span class="mw">'+esc(f.w)+'</span><span class="mwhy">→ '+esc(f.why)+(f.hype?"（規約でもNG）":"")+'</span></div>'));
}
$("view").addEventListener("input",e=>{const t=e.target;if(!t.matches("textarea[data-idx]"))return;
  const acc=state.tab,i=+t.dataset.idx; state.queues[acc].data.items[i].text=t.value; refreshCheck(acc,i);});
$("view").addEventListener("click",e=>{const b=e.target.closest("[data-tg]");if(!b)return;
  const it=state.queues[state.tab].data.items[+b.dataset.tg]; it.approved=!it.approved;

$("save").onclick=async()=>{
  const acc=state.tab, q=state.queues[acc]; if(!q)return;
  setMsg("保存中…","info");
  try{
    const r=await putFile(q.path,JSON.stringify(q.data,null,2),q.sha,"approve("+acc+"): "+state.date);
    if(r.conflict){setMsg("自動投稿の記録とぶつかりました。読み込み直したので、もう一度変更して保存してください。","err");await route();return;}
    q.sha=r.sha;
    const ok=q.data.items.filter(x=>x.approved&&!x.posted&&!x.skipped).length;
    setMsg("保存した。これから出る予定は "+ok+" 本。","good");
  }catch(e){setMsg(e.message,"err");}
};

/* ===== note ===== */
function parseNote(md){
  const i=md.search(/^## note/m); if(i<0) return null;
  const sec=md.slice(i).split("\n").slice(1);
  const ti=sec.findIndex(l=>/^### /.test(l)); if(ti<0) return null;
  const title=sec[ti].replace(/^###\s+/,"").trim();
  const rest=sec.slice(ti+1);
  const end=rest.findIndex(l=>/^_\d+字/.test(l.trim()));
  const body=(end<0?rest:rest.slice(0,end)).join("\n").trim();
  const other=(md.match(/別のネタ候補:\s*(.*)/)||[])[1]||"";
  return {title,body,other};
}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");}
function md2html(src){
  return src.split(/\n\s*\n/).map(b=>{
    b=b.trim(); if(!b) return "";
    if(/ここから有料/.test(b)&&b.length<30) return '<hr class="paywall">';
    const h=b.match(/^(#{1,6})\s+(.+)$/);
    if(h&&!b.includes("\n")) return (h[1].length<=2?"<h2>":"<h3>")+inline(h[2])+(h[1].length<=2?"</h2>":"</h3>");
    return "<p>"+b.split("\n").map(inline).join("<br>")+"</p>";
  }).join("");
}
function md2text(src){return src.replace(/^#{1,6}\s+/gm,"").replace(/\*\*(.+?)\*\*/g,"$1");}
async function copyRich(html,text){
  try{
    if(window.ClipboardItem&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);
    }else{await navigator.clipboard.writeText(text);}
    setMsg("コピーした。noteの本文欄に貼り付けてください。","good");
  }catch(e){setMsg("コピーできませんでした: "+e.message,"err");}
}
function chromePrompt(acc,n){

  const L=[];
  L.push("noteに記事の下書きを作ってください。公開はせず、下書き保存までで止めてください。");
  L.push("");
  L.push("【素材のある場所】");
  L.push("管制塔: "+here);
  L.push("（このタブで開くと、記事・サムネ・コピー用のボタンが表示されます）");
  L.push("");
  L.push("【記事の情報】");
  L.push("・アカウント: "+ACC[acc].handle+" に対応するnoteアカウント（ログイン中のnoteアカウントが違う場合は作業せず、教えてください）");
  L.push("・タイトル: "+n.title);
  L.push("・種類: "+(paid?"有料（"+n.price+"円）":"無料"));
  if(n.hashtags&&n.hashtags.length){
    const chosen=[...document.querySelectorAll("#tagBox .tag.on")].map(b=>n.hashtags[+b.dataset.tag]);
    L.push("・ハッシュタグ: "+(chosen.length?chosen:n.hashtags).join(" "));
  }
  L.push("");
  L.push("【手順】");
  L.push("1. note.com で「投稿」→「テキスト」を開き、新しい記事を作る");
  L.push("2. タイトル欄に上のタイトルを入力する");
  L.push("3. 管制塔の「本文（書式つき）」ボタンを押してコピーし、noteの本文欄に貼り付ける。見出しや太字が崩れていたら、noteの見出し機能で整える");
  L.push("4. 管制塔の「サムネを保存」でダウンロードした画像を、noteの見出し画像に設定する");
  if(paid){
    L.push("5. 本文中の「――― ここから有料 ―――」の行を削除し、その位置に有料エリアの境界線を置く");
    L.push("6. 公開設定で「有料」を選び、価格を"+n.price+"円にする");
    L.push("7. ハッシュタグを上のとおり設定する");
    L.push("8. 「下書き保存」を押す。公開ボタンは押さない");
  }else{
    L.push("5. ハッシュタグを上のとおり設定する");
    L.push("6. 「下書き保存」を押す。公開ボタンは押さない");
  }
  L.push("");
  L.push("終わったら、うまくいかなかった箇所があれば具体的に教えてください。");
  return L.join("\n");
}

async function viewNote(acc){
  const jpath=ACC[acc].n+"/"+state.date+".json";
  const jf=await getFile(jpath);
  let n=null, sha=null;
  if(jf.status===200){n=JSON.parse(jf.text);sha=jf.sha;}
  else{
    const f=await getFile(ACC[acc].d+"/"+state.date+".md");
    const old=f.status===200?parseNote(f.text):null;
    if(old) n={title:old.title,body:old.body,kind:"free",alt_titles:old.other?old.other.split(" / "):[],hashtags:[]};
  }
  if(!n){$("view").innerHTML=subTabs(acc)+'<p class="type">'+state.date+' のnote下書きはありません（noteの生成日だけ作られます）</p>';setMsg("");return;}
  const html=md2html(n.body);
  const paid=n.kind==="paid";
  $("view").innerHTML=subTabs(acc)
    +'<div class="card">'
    +'<div class="meta"><span class="badge '+(paid?"red":"good")+'">'+(paid?"有料・"+n.price+"円":"無料")+'</span>'
    +(n.chars?'<span class="type">'+n.chars+'字</span>':'')
    +(n.announced?'<span class="badge good right">告知済み '+esc(n.announced.slice(5))+'</span>':(n.url?'<span class="badge right">明朝に告知予定</span>':''))+'</div>'
    +'<div id="thumbBox" style="margin:4px 0 12px"></div>'
    +'<p class="ntitle">'+esc(n.title)+'</p>'
    +'<div class="row" style="margin-bottom:12px">'
    +'<button class="btn small" id="cpTitle">タイトル</button>'
    +'<button class="btn small" id="cpBody">本文（書式つき）</button>'
    +'<a class="btn ghost small" href="https://note.com/" target="_blank" rel="noopener" style="text-decoration:none">noteを開く</a></div>'
    +'<div style="margin:-4px 0 12px"><button class="btn small" id="cpPrompt" style="background:var(--good)">Claude in Chrome用の指示をコピー</button></div>'
    +(paid?'<p class="hint" style="margin-top:0">有料回：noteの編集画面で、赤い点線の位置に「有料エリア」の境界線を置き、価格を'+n.price+'円に設定してください。</p>':'')
    +'<div class="article">'+html+'</div>'
    +(n.alt_titles&&n.alt_titles.length?'<p class="hint">別のタイトル候補：'+n.alt_titles.map(esc).join(" / ")+'</p>':'')
    +'</div>'
    +(n.hashtags&&n.hashtags.length?'<div class="card"><h2 class="sec">ハッシュタグ（'+n.hashtags.length+'個）</h2>'
      +'<p class="hint" style="margin-top:0">関連するnote記事でよく使われている順。タップで選ぶ／外す（最初は全部選択）。</p>'
      +'<div class="tags" id="tagBox">'+n.hashtags.map((t,i)=>'<button class="tag on" data-tag="'+i+'">'+esc(t)+'</button>').join("")+'</div>'
      +'<div class="row"><button class="btn small" id="cpTagsSel">選んだタグをコピー</button>'
      +'<button class="btn ghost small" id="tagAll">全部選ぶ</button><button class="btn ghost small" id="tagNone">全部外す</button></div></div>':'')
    +(jf.status===200?'<div class="card"><h2 class="sec">公開したらURLを登録</h2>'
      +'<input type="text" id="noteUrl" placeholder="https://note.com/..." value="'+esc(n.url||"")+'" autocapitalize="off" spellcheck="false"/>'
      +'<div style="margin-top:10px"><button class="btn" id="saveUrl">登録する</button></div>'
      +'<p class="hint">登録すると、翌朝の生成で '+esc(ACC[acc].handle)+' の最後の枠がこの記事の告知投稿になります。</p></div>':'');

  if(n.thumb){
    const u=await getBlobURL(n.thumb);
    if(u) $("thumbBox").innerHTML='<img src="'+u+'" alt="サムネ" style="width:100%;border-radius:10px;border:1px solid var(--rule)">'
      +'<div style="margin-top:8px"><a class="btn ghost small" href="'+u+'" download="'+acc+'_'+state.date+'.png" style="text-decoration:none">サムネを保存</a></div>';
  }
  $("cpTitle").onclick=()=>navigator.clipboard.writeText(n.title).then(()=>setMsg("タイトルをコピーした。","good"));
  $("cpBody").onclick=()=>copyRich(html.replace(/<hr class="paywall">/g,"<p>――― ここから有料 ―――</p>"),md2text(n.body));
  $("cpPrompt").onclick=()=>navigator.clipboard.writeText(chromePrompt(acc,n)).then(()=>setMsg("指示をコピーした。Claude in Chromeに貼り付けてください。","good"));
  if($("tagBox")){
    const sel=()=>[...document.querySelectorAll("#tagBox .tag.on")].map(b=>n.hashtags[+b.dataset.tag]);
    $("tagBox").onclick=e=>{const b=e.target.closest(".tag");if(b)b.classList.toggle("on");};
    $("tagAll").onclick=()=>document.querySelectorAll("#tagBox .tag").forEach(b=>b.classList.add("on"));
    $("tagNone").onclick=()=>document.querySelectorAll("#tagBox .tag").forEach(b=>b.classList.remove("on"));
    $("cpTagsSel").onclick=()=>{const t=sel();if(!t.length){setMsg("タグが選ばれていません","err");return;}
      navigator.clipboard.writeText(t.join(" ")).then(()=>setMsg(t.length+"個のハッシュタグをコピーした。","good"));};
  }
  if($("saveUrl")) $("saveUrl").onclick=async()=>{
    const url=$("noteUrl").value.trim();
    if(!/^https:\/\/note\.com\//.test(url)){setMsg("noteの記事URL（https://note.com/〜）を入れてください","err");return;}
    setMsg("登録中…","info");
    try{
      const cur=await getFile(jpath); const data=JSON.parse(cur.text); data.url=url;
      const r=await putFile(jpath,JSON.stringify(data,null,2),cur.sha,"note url("+acc+"): "+state.date);
      if(r.conflict){setMsg("ぶつかりました。もう一度押してください。","err");return;}
      setMsg("登録した。明日の朝、告知投稿が作られます。","good");
    }catch(e){setMsg(e.message,"err");}
  };
  setMsg("");
}

/* ===== 数字 ===== */
async function viewStats(){
  const keys=Object.keys(ACC);
  const days=[...Array(14)].map((_,i)=>addDays(state.date,-i));
  const fol={}, posts=[];
  await Promise.all(keys.map(async k=>{
    const f=await getFile("metrics/"+k+"/followers.jsonl");
    fol[k]={};
    if(f.status===200) f.text.split("\n").filter(Boolean).forEach(l=>{try{const r=JSON.parse(l);fol[k][r.date]=r.followers;}catch(_){}});
    await Promise.all(days.map(async d=>{
      const q=await getFile(ACC[k].q+"/"+d+".json");
      if(q.status!==200) return;
      (JSON.parse(q.text).items||[]).forEach(it=>{ if(it.posted) posts.push({acc:k,date:d,...it}); });
    }));
  }));

  const notes=await getFile("metrics/note.jsonl");
  const noteRows=notes.status===200?notes.text.split("\n").filter(Boolean).map(l=>JSON.parse(l)):[];

  let html='<div class="card"><h2 class="sec">フォロワー推移</h2><div class="chartbox"><canvas id="cFol"></canvas></div></div>'
    +'<div class="card"><h2 class="sec">型別の平均閲覧（24h・直近14日）</h2>'
    +'<select id="typeAcc" style="max-width:240px;margin-bottom:8px">'+keys.map(k=>'<option value="'+k+'">'+ACC[k].handle+'</option>').join("")+'</select>'
    +'<div class="chartbox"><canvas id="cType"></canvas></div></div>'
    +'<div class="card"><h2 class="sec">閲覧トップ5（24h・直近14日）</h2><div id="top"></div></div>'
    +'<div class="card"><h2 class="sec">noteの数字を記録（週1）</h2>'
    +'<label>アカ</label><select id="nAcc">'+keys.map(k=>'<option value="'+k+'">'+ACC[k].handle+'</option>').join("")+'</select>'
    +'<label>記事タイトル</label><input type="text" id="nTitle"/>'
    +'<div class="grid2"><div><label>公開日</label><input type="date" id="nPub"/></div><div><label>種類</label><select id="nKind"><option>無料</option><option>有料</option></select></div>'
    +'<div><label>閲覧</label><input type="number" id="nViews"/></div><div><label>スキ</label><input type="number" id="nLikes"/></div>'
    +'<div><label>販売数</label><input type="number" id="nSales"/></div><div><label>売上（円）</label><input type="number" id="nRev"/></div></div>'
    +'<div style="margin-top:12px"><button class="btn" id="nSave">記録する</button></div>'
    +'<p class="hint">記録は metrics/note.jsonl に追記され、毎晩スプレッドシートにも反映されます。直近の記録：'+noteRows.length+'件</p></div>';
  $("view").innerHTML=html;

  /* フォロワー */
  const fDays=[...new Set(keys.flatMap(k=>Object.keys(fol[k])))].sort();
  state.chart.push(new Chart($("cFol"),{type:"line",
    data:{labels:fDays.map(d=>d.slice(5)),datasets:keys.map(k=>({label:ACC[k].handle,data:fDays.map(d=>fol[k][d]??null),
      borderColor:CHART_COLOR[k],backgroundColor:CHART_COLOR[k],spanGaps:true,tension:.25}))},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}}));

  /* 型別 */
  const drawType=()=>{
    const k=$("typeAcc").value, agg={};
    posts.filter(p=>p.acc===k&&p.m24&&p.m24.views!=null).forEach(p=>{(agg[p.type]=agg[p.type]||[]).push(p.m24.views);});
    const ts=Object.keys(ACC[k].types);
    const vals=ts.map(t=>agg[t]?Math.round(agg[t].reduce((a,b)=>a+b,0)/agg[t].length):0);
    const old=state.chart.find(c=>c.canvas.id==="cType"); if(old){old.destroy();state.chart=state.chart.filter(c=>c!==old);}
    state.chart.push(new Chart($("cType"),{type:"bar",
      data:{labels:ts.map(t=>ACC[k].types[t]),datasets:[{label:"平均閲覧",data:vals,backgroundColor:CHART_COLOR[k]}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}}));
  };
  $("typeAcc").onchange=drawType; drawType();

  /* トップ5 */
  const top=posts.filter(p=>p.m24&&p.m24.views!=null).sort((a,b)=>b.m24.views-a.m24.views).slice(0,5);
  $("top").innerHTML=top.length?top.map(p=>'<div class="top"><b>閲覧'+p.m24.views+'</b>　'+esc(ACC[p.acc].handle)+'　'+p.date.slice(5)+' '+esc(p.slot)
    +'　'+esc(ACC[p.acc].types[p.type]||p.type)+'<br><span class="type">'+esc((p.text||"").replace(/\n/g," ").slice(0,60))+'</span></div>').join("")
    :'<p class="type">まだ24h後の数字がありません（投稿の翌晩から溜まります）</p>';

  /* note記録 */
  $("nPub").value=state.date;
  $("nSave").onclick=async()=>{
    const row={recorded:todayJST(),account:$("nAcc").value,title:$("nTitle").value.trim(),published:$("nPub").value,kind:$("nKind").value,
      views:+$("nViews").value||0,likes:+$("nLikes").value||0,sales:+$("nSales").value||0,revenue:+$("nRev").value||0};
    if(!row.title){setMsg("記事タイトルを入れてください","err");return;}
    setMsg("記録中…","info");
    try{
      for(let n=0;n<2;n++){
        const f=await getFile("metrics/note.jsonl");
        const text=(f.status===200?f.text.replace(/\n*$/,"\n"):"")+JSON.stringify(row)+"\n";
        const r=await putFile("metrics/note.jsonl",text,f.status===200?f.sha:null,"note metrics: "+row.title);
        if(!r.conflict){setMsg("記録した。","good");["nTitle","nViews","nLikes","nSales","nRev"].forEach(id=>$(id).value="");return;}
      }
      setMsg("保存がぶつかりました。少し待ってもう一度押してください。","err");
    }catch(e){setMsg(e.message,"err");}
  };
  setMsg("");
}
